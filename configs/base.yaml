data:
  resample_rate: "30S"
  window_size: 100
  val_ratio: 0.1

normalization:
  method: "clipped_value_minmax"
  clip_quantile: 0.995
  clip_value: 5000

model:
  type: "STMModel"

training:
  max_epochs: 20
  batch_size: 16
  learning_rate: 0.0001
  patience: 2

evaluation:
  model: "models/2025-12-08_20-03_best_model.pth "
